{% extends "base.html" %}

{% load static %}

{% block styles %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/texts.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/boxes.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/buttons.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/inputs.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/layouts.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/modals.css' %}"/>
{% endblock styles %}

{% block header %}
    <h2 class="title txt-clear">ICheckout - Habitaciones</h2>
{% endblock header %}

{% block content %}
    <div style="width: 60%;" class="box">
        <h3 class="title">Actualizar datos de habitacion {{ id }}</h3>
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button class="btn  btn-primary" type="submit">guardar</button>
        </form>
    </div>
{% endblock content %}
