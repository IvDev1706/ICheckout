{% extends "base_app.html" %}

{% load static %}

{% block content %}
    <div class="box width-50 column-layout">
        <h3 class="subtitle">Información de la cuenta</h3>
        <div class="row-layout">
            <img 
                class="img"
                src="{% static 'assets/icheckout_user.png' %}"
                alt="type_picture" width="320" height="320"
            />
            <div>
                <p>Id de usuario: {{ user.pk }}</p>
                <p>Nombre: {{ user.name }}</p>
                <p>Rol: {{ user.role }}</p>
            </div>
        </div>
        <div class="row-layout">
            <a class="btn btn-primary" href="/home/">
                volver a pantalla principal
            </a>
            <a class="btn btn-primary" href="/logout">cerrar sesion</a>
        </div>
    </div>
{% endblock content %}
