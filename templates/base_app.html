{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" value="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
        <link rel="icon" type="image/x-icon" href="{% static 'assets/icheckout_logo.png' %}">   
        <link rel="stylesheet" type="text/css" href="{% static 'css/base_app.css' %}"/>
        {% block scripts %}{% endblock scripts %}
    </head>
    <body>
        <header>
            <div class="row-layout between">
                <img src="{% static 'assets/icheckout_logo.png' %}" height="64" width="64"/>
                <h2 class="title">
                    {{ subtitle }}
                </h2>
                <div class="column-layout center">
                    <a class="btn btn-secondary" href="/profile">mi perfil</a>
                </div>
            </div>
        </header>
        <nav>
            {% block nav %}
            {% endblock nav %}
        </nav>
        <main>
            {% block content %}
            <p>Sin contenido</p>
            {% endblock content %}
        </main>
    </body>
</html>
