{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" value="width=device-width, initial-scale=1.0">
        <title>{{ title }}</title>
        <link rel="icon" type="image/x-icon" href="{% static 'assets/icheckout_logo.png' %}">   
        <link rel="stylesheet" type="text/css" href="{% static 'css/base_login.css' %}"/>
        {% block scripts %}{% endblock scripts %}

    <body>
        <main class="bg-primary column-layout completely-center">
            <div class="box width-40">

                    <p>Sin contenido</p>
                {% endblock content %}
            </div>
        </main>
    </body>
</html>
